<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChristHelper | Verify Email</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="text-center">
        <div class="brand" style="justify-content:center;"><span class="brand-mark">✝</span> ChristHelper</div>
        <h1 style="font-size:2rem;margin-top:16px;">Verify your email</h1>
        <p>Enter the 6-digit code sent to your email sandbox inbox.</p>
      </div>
      <form id="verifyEmailForm" class="simple-form">
        <input name="email" type="email" placeholder="Email" required>
        <input name="code" inputmode="numeric" maxlength="6" placeholder="Verification code" required>
        <button class="btn" type="submit">Verify email</button>
        <button class="btn-outline" id="resendVerificationBtn" type="button">Resend code</button>
        <a class="btn-outline" href="login.html">Back to login</a>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
