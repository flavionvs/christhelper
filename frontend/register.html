<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChristHelper | Register</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="text-center">
        <div class="brand" style="justify-content:center;"><span class="brand-mark">✝</span> ChristHelper</div>
        <h1 style="font-size:2.1rem;margin-top:16px;">Create account</h1>
        <p>Register as a supporter or project owner.</p>
      </div>
      <form id="registerForm" class="simple-form">
        <input name="name" placeholder="Full name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button class="btn" type="submit">Register</button>
        <a class="btn-outline" href="login.html">Already have an account?</a>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
