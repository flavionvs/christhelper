<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChristHelper | Register</title>
  <link rel="stylesheet" href="css/styles.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VEBD7Q9H0S"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VEBD7Q9H0S');
</script>
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="text-center">
        <div class="brand" style="justify-content:center;"><span class="brand-mark"><img src="assets/christhelper-logo.png" alt="ChristHelper logo"></span> ChristHelper</div>
        <h1 style="font-size:2.1rem;margin-top:16px;">Create account</h1>
        <p>Register as a supporter or request owner.</p>
      </div>
      <form id="registerForm" class="simple-form">
        <input name="name" placeholder="Full name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" minlength="6" required>
        <label class="checkbox-field">
          <input name="terms_accepted" type="checkbox" required>
          <span>I have read and agree to the <a href="terms.html" style="color:var(--primary);text-decoration:underline;">Terms &amp; Conditions</a>.</span>
        </label>
        <button class="btn" type="submit">Register</button>
        <a class="btn-outline" href="login.html">Already have an account?</a>
        <a class="btn-outline" href="terms.html">Terms &amp; Conditions</a>
      </form>
    </section>
  </main>
  <footer class="site-footer site-footer--compact">
    <div class="container site-footer__bottom">
      <span>&copy; <span data-year>2026</span> ChristHelper</span>
      <span class="site-footer__bottom-links">
        <a href="index.html">Home</a>
        <a href="terms.html">Terms</a>
        <a href="help-christhelper.html">Get involved</a>
        <a class="site-footer__social site-footer__social--icon" href="https://www.instagram.com/christhelperofficial/" target="_blank" rel="noopener" aria-label="ChristHelper on Instagram (opens in a new tab)"><svg class="ig-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.15" fill="currentColor"/></svg><span>Instagram</span></a>
      </span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
