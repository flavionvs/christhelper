<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChristHelper | Reset Password</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="text-center">
        <div class="brand" style="justify-content:center;"><span class="brand-mark"><img src="assets/christhelper-logo.png" alt="ChristHelper logo"></span> ChristHelper</div>
        <h1 style="font-size:2rem;margin-top:16px;">Reset password</h1>
        <p>Enter the reset code from your email inbox and choose a new password.</p>
      </div>
      <form id="resetPasswordForm" class="simple-form">
        <input name="email" type="email" placeholder="Email" required>
        <input name="code" inputmode="numeric" maxlength="6" placeholder="Reset code" required>
        <input name="password" type="password" placeholder="New password" minlength="6" required>
        <input name="confirm_password" type="password" placeholder="Confirm new password" minlength="6" required>
        <button class="btn" type="submit">Reset password</button>
        <a class="btn-outline" href="login.html">Back to login</a>
      </form>
    </section>
  </main>
  <footer class="site-footer site-footer--compact">
    <div class="container site-footer__bottom">
      <span>&copy; <span data-year>2026</span> ChristHelper</span>
      <span class="site-footer__bottom-links">
        <a href="index.html">Home</a>
        <a href="terms.html">Terms</a>
        <a href="help-christhelper.html">Get involved</a>
        <a class="site-footer__social site-footer__social--icon" href="https://www.instagram.com/christhelperofficial/" target="_blank" rel="noopener" aria-label="ChristHelper on Instagram (opens in a new tab)"><svg class="ig-glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="1.15" fill="currentColor"/></svg><span>Instagram</span></a>
      </span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
