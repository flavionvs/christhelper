<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChristHelper | Forgot Password</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="text-center">
        <div class="brand" style="justify-content:center;"><span class="brand-mark">✝</span> ChristHelper</div>
        <h1 style="font-size:2rem;margin-top:16px;">Forgot password</h1>
        <p>Enter your email and we will send you a password reset code.</p>
      </div>
      <form id="forgotPasswordForm" class="simple-form">
        <input name="email" type="email" placeholder="Email" required>
        <button class="btn" type="submit">Send reset code</button>
        <a class="btn-outline" href="reset-password.html">I already have a code</a>
        <a class="btn-outline" href="login.html">Back to login</a>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
