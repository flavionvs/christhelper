<html lang="en">
<head>

  <link rel="stylesheet" href="css/styles.css">

<body>
  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="text-center">
        <div class="brand" style="justify-content:center;"><span class="brand-mark">✝</span> ChristHelper</div>
        <h1 style="font-size:2.1rem;margin-top:16px;">Sign in</h1>
        <p>Access your profile, requests, prayers, replies, and donations.</p>
      </div>
      <form id="loginForm" class="simple-form">
        <input name="email" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button class="btn" type="submit">Login</button>
        <a class="btn-outline" href="forgot-password.html">Forgot password?</a>
        <a class="btn-outline" href="register.html">Create account</a>
        <a class="btn-outline" href="terms.html">Terms &amp; Conditions</a>
        <a class="btn-outline" href="index.html">Back to home</a>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
